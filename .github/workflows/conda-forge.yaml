name: Conda Forge

on:
  push:
  workflow_dispatch:

jobs:
  conda-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-64
          - os: macos-latest
            platform: osx-64

    steps:
      - uses: actions/checkout@main

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build

      - name: Build conda package
        shell: bash -l {0}
        run: rattler-build build --recipe recipe/recipe.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: conda-package-${{ matrix.platform }}
          path: output/**/*.conda

  create-release-pr:
    needs: conda-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@main

      - name: Download artifacts
        uses: actions/download-artifact@main
        with:
          path: dist

      - name: Create Release with Instructions
        uses: softprops/action-gh-release@master
        with:
          generate_release_notes: true
          body: |
            ## Conda Forge Submission

            To submit this package to conda-forge:

            1. Clone staged-recipes:
               ```bash
               git clone --depth=1 https://github.com/conda-forge/staged-recipes.git
               cd staged-recipes
               ```

            2. Copy the recipe:
               ```bash
               cp -r /path/to/ensor/recipe recipes/ensor
               ```

            3. Update the SHA256 hash in `recipes/ensor/recipe.yaml`

            4. Create a PR to `conda-forge/staged-recipes`
          files: dist/**/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          token: ${{ github.token }}
