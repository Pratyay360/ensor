name: ci

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Trust git directory in container
        run: git config --global --add safe.directory '*'

      - name: Setup aqua
        uses: aquaproj/aqua-installer@v4
        with:
          aqua_version: v2.64.0

      - name: Install dependencies & building
        run: |
            aqua i
            goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
