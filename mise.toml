[tools]
go = "latest"
"go:github.com/spf13/cobra-cli" = "latest"
goreleaser = "latest"

[tasks]
testcase = { description = "Run Go testcase", run = "go run ./test/test.go" }
build = { description = "Build Go binary", run = "[mise deps, goreleaser build --snapshot --clean]" }
test = { description = "test binary", run = "[mise deps, mise run testcase, mise run build]" }
release = { description = "release", run = "[mise run build, goreleaser]" }
release-check = { description = "Validate GoReleaser config", run = "[mise deps, goreleaser check]" }
release-snapshot = { description = "Full snapshot release (archives + packages)", run = "goreleaser release --snapshot --clean" }

[deps]
go = { auto = true }
