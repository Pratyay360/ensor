schema_version: 1

context:
  version: "0.1.0"

package:
  name: ensor
  version: ${{ version }}

source:
  url: https://github.com/Pratyay360/ensor/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  target_directory: src

build:
  number: 0
  script:
    - cd src
    - go-licenses save . --save_path ../library_licenses
    - if: unix
      then: go build -v -o $PREFIX/bin/ensor -ldflags="-s -w" .
      else: go build -v -o %LIBRARY_BIN%\ensor.exe -ldflags="-s" .

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script: ensor --help
  - package_contents:
      bin:
        - ensor
      strict: true

about:
  homepage: https://github.com/Pratyay360/ensor
  summary: Environment variables manager and code censoring tool
  description: |
    A CLI tool for managing and censoring secrets in your codebase.
    Ensor helps you redact sensitive information from source code,
    manage environment variables, and convert between different
    env file formats (.env, YAML, TOML, JSON, etc.).
  license: Apache-2.0
  license_file:
    - src/LICENSE
    - library_licenses/
  documentation: https://docs.pratyay.qzz.io/guides/1788717438/
  repository: https://github.com/Pratyay360/ensor

extra:
  recipe-maintainers:
    - Pratyay360
